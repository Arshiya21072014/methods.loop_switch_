<!DOCTYPE html>
<html>
<body>
    <h1>Java Script For Loop</h1>
    <p id="demo"></p>
    <script>
          var fruits=[ "Apple","Mango","Grapes","Watermelon","Banana"]
          for( i=0; i <fruits.length; i++){
          var text= fruits[i]+ "<br>";
        document.write(text);
          }
    </script>
</body>
</html>
